<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>郵戳慢慢集｜戳圖圖鑑</title>
<style>
:root{--paper:#f9f6ef;--cream:#fffdf8;--ink:#233c4d;--ink2:#536774;--line:#e6dfd1;--accent:#b95744;--pale:#f1e8db;--good:#336b5a;--warn:#986b2b;--shadow:0 9px 25px rgba(43,54,54,.075)}
*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c49c5b;outline-offset:2px}a{color:#1f667a}header{background:var(--ink);color:white;position:relative;overflow:hidden}.headwrap{max-width:1160px;margin:auto;padding:54px 22px 48px;position:relative}.postmark{position:absolute;border:3px double rgba(255,255,255,.22);border-radius:50%;height:165px;width:165px;right:40px;top:30px;transform:rotate(13deg);text-align:center;display:flex;align-items:center;justify-content:center;letter-spacing:.15em;font-size:22px;pointer-events:none}.postmark:before{content:"POSTAL · TAIWAN";font-size:11px;position:absolute;top:28px}.eyebrow{letter-spacing:.19em;text-transform:uppercase;font-size:12px;color:#e0c7a8;font-weight:700}h1{font-size:clamp(32px,5.2vw,54px);letter-spacing:.07em;margin:8px 0 10px;font-weight:800}.subtitle{margin:0;max-width:640px;color:#e5ebed;font-size:16px}.headmeta{margin-top:20px;display:flex;gap:9px;flex-wrap:wrap}.headmeta span{border:1px solid rgba(255,255,255,.24);padding:3px 12px;border-radius:18px;font-size:12px;color:#f1eade}main{max-width:1160px;margin:auto;padding:26px 22px 70px}.info{background:#fffaf0;border:1px solid #ead8b4;border-radius:12px;padding:13px 16px;font-size:13px;color:#705728;margin-bottom:22px}.info b{color:#75502a}.filters{background:var(--cream);padding:22px;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.filters h2{font-size:18px;margin:0 0 12px}.fields{display:grid;grid-template-columns:2.3fr 1fr 1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:750;color:var(--ink2)}.field input,.field select{height:42px;width:100%;padding:8px 11px;background:#fff;border:1px solid #d9d7cf;border-radius:9px;color:var(--ink);min-width:0}.rowfilter{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px}.tick{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}.tick input{accent-color:var(--accent);height:17px;width:17px}.plainbtn{border:1px solid #d0d5d3;background:#fff;border-radius:8px;padding:7px 12px;color:var(--ink);font-size:13px}.resultsline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:23px 0 16px}.resultsline strong{font-size:17px}.resultsline small{color:var(--ink2)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{display:flex;flex-direction:column;background:var(--cream);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);min-width:0}.picture{height:205px;position:relative;background:#f0ece3;display:flex;align-items:center;justify-content:center;padding:15px;overflow:hidden}.picture img{display:block;max-width:100%;max-height:100%;object-fit:contain;filter:contrast(1.04)}.image-button{border:0;background:none;padding:0;height:100%;width:100%;display:flex;align-items:center;justify-content:center}.image-button:hover img{transform:scale(1.05)}.image-button img{transition:transform .2s}.image-fail{font-size:13px;color:#77858c;text-align:center;padding:20px;display:none}.smallcorner{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);font-size:11px;border-radius:20px;padding:3px 10px;color:#5d6a70}.body{padding:17px 18px 18px;display:flex;flex-direction:column;flex:1}.date{font-size:12px;letter-spacing:.05em;font-weight:750;color:var(--accent)}.date .region{color:#71808a;font-weight:600;margin-left:8px}.body h3{font-size:17px;line-height:1.42;margin:7px 0 11px;min-height:48px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}.tag{font-size:11px;border-radius:6px;padding:3px 8px;background:#eef0ee;color:#5c6970}.tag.future{background:#e5eee9;color:#39725a}.tag.grace{background:#f7eada;color:#8e632e}.tag.past{background:#e9e9e7;color:#777}.tag.pending{background:#fff0e7;color:#a25337}.details{padding:12px;background:#f5f3ed;border:1px solid #ebe6db;border-radius:10px;margin-top:auto}.details .k{font-size:11px;color:#6d7a80;font-weight:700}.details .v{font-size:13px;color:var(--ink);margin:1px 0 8px;overflow-wrap:anywhere}.details .v:last-child{margin-bottom:0}.note{font-size:12px;color:#68767b;margin-top:9px}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}.action{font-size:12px;text-decoration:none;padding:7px 10px;border-radius:8px;border:1px solid #d6dcd8;background:#fff;color:#315d6c}.action:hover{background:#edf4f1}.action.accent{background:#f3e8df;border-color:#e9caba;color:#8e4b33}.empty{background:#fff;border:1px solid var(--line);border-radius:15px;padding:50px 20px;text-align:center;color:var(--ink2)}footer{margin-top:40px;border-top:1px solid var(--line);padding-top:19px;font-size:12px;color:#687780}footer p{margin:6px 0}dialog{border:0;border-radius:15px;padding:0;background:#fffdf8;color:var(--ink);width:min(840px,96vw);max-height:94vh;box-shadow:0 30px 90px #14273855}dialog::backdrop{background:#0d2038b9}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:16px;margin:0}.modal-head button{background:white;border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:19px}.modal-body{padding:12px 20px 24px;text-align:center;overflow:auto;max-height:75vh}.modal-body img{max-width:100%;max-height:65vh;object-fit:contain}.modal-foot{display:flex;justify-content:center;gap:10px;margin-top:9px}.modal-foot button{border:1px solid var(--line);border-radius:7px;background:white;padding:7px 13px;color:var(--ink)}.statusdot{width:7px;height:7px;display:inline-block;border-radius:50%;background:#d7c4a6;margin-right:5px}.statusdot.good{background:#72c3a3}.err{color:#b35a43;font-size:12px}.sr-only{position:absolute;height:1px;width:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:920px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.fields{grid-template-columns:1fr 1fr}.postmark{opacity:.25}}@media(max-width:620px){.headwrap{padding:42px 20px}.postmark{right:-40px;top:5px;opacity:.13}.filters{padding:17px}.fields{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.picture{height:235px}.resultsline{align-items:start;flex-direction:column}}
[aria-current="page"].action{background:var(--ink);border-color:var(--ink);color:white}
.category-nav{margin:0 0 18px}
.category-title{font-size:clamp(23px,3vw,32px);margin:0 0 8px}
button,input,select{font-family:inherit}

.filters input[type="search"],.filters input[type="date"],.filters select{min-width:0;max-width:100%;box-sizing:border-box;font-size:16px;min-height:44px}
.catalog-fields{display:grid;grid-template-columns:minmax(0,2fr) minmax(140px,1fr);gap:16px;align-items:end}
.catalog-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.catalog-field input,.catalog-field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}
.catalog-options{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.location-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.location-actions button{min-height:44px}
.location-status{margin:10px 0 0;font-size:14px;overflow-wrap:anywhere}
button:disabled{opacity:.6;cursor:wait}
@media(max-width:620px){
 main{padding:20px 16px 48px}
 .headwrap{padding:32px 16px}
 .catalog-fields{grid-template-columns:minmax(0,1fr);gap:14px}
 .catalog-options{align-items:flex-start}
 .catalog-options>label{display:flex;gap:8px;align-items:flex-start}
 .location-actions{width:100%}
 .location-actions button{flex:1 1 140px}
 .category-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
 .category-nav .action{text-align:center;padding:10px 4px;margin:0}
 .rowfilter{gap:12px}
 .rowfilter .tick{max-width:100%;flex-wrap:wrap}
 .filters .field{min-width:0}
 .body{overflow-wrap:anywhere}
}

.admin-entry{display:flex;justify-content:flex-end;margin-top:20px;font-size:13px}.admin-entry a{display:inline-block;padding:7px 12px;border:1px solid rgba(255,255,255,.4);border-radius:8px;color:white;text-decoration:none}.admin-entry a:hover{background:#36566a}.headwrap{padding-top:54px;padding-bottom:20px}@media(max-width:620px){.headwrap{padding-top:32px;padding-bottom:18px}.admin-entry{margin-top:18px}.admin-entry a{padding:7px 10px}}
#cards{margin-top:16px}
</style>
<body>
<header><div class="headwrap"><div class="postmark">集 郵</div><div class="eyebrow">POSTMARK COLLECTION · TAIWAN</div><h1>郵戳慢慢集</h1><p class="subtitle">查找臨時郵局戳、紀念戳與風景戳，收錄戳圖和中華郵政官方資料。</p><div class="headmeta"><span>資料來源：中華郵政</span><span>每天嘗試自動更新</span></div><div class="admin-entry"><a href="https://github.com/login?return_to=%2Fzhuya-tw%2Fpostmark-collection%2Fsettings" target="_blank" rel="noopener noreferrer" title="使用 GitHub 帳號登入網站管理">管理者登入 ↗</a></div></div></header>
<main>
<nav class="rowfilter category-nav" aria-label="郵戳分類"><a class="action" href="index.html">臨時郵局戳</a><a class="action" href="catalog.html?type=commemorative">紀念戳</a><a class="action" href="catalog.html?type=scenic">風景戳</a></nav>
<h2 id="title" class="category-title">戳圖圖鑑</h2>
<p id="intro"></p>
<section class="filters" aria-label="查詢條件">
<div class="catalog-fields">
<div class="catalog-field"><label for="query">搜尋名稱或使用局所</label><input id="query" type="search" placeholder="輸入戳名、郵局或地區"></div>
<div class="catalog-field"><label for="year">年份</label><select id="year"><option value="">全部年份</option></select></div>
</div>
<div class="catalog-options">
<label id="history-filter" hidden><input id="history" type="checkbox"> 顯示已過使用期限的紀念戳</label>
<div id="scenic-location" hidden>
<div class="location-actions"><button type="button" class="action" id="locate-scenic" disabled>依我的位置找風景戳</button><button type="button" class="action" id="clear-location" hidden>清除定位排序</button></div>
<p id="location-status" class="location-status" role="status"></p>
</div>
</div>
</section>
<p id="result" role="status">正在讀取戳圖資料…</p>
<div class="cards" id="cards"></div>
</main>

<script src="catalog.js?v=20261112-public-clean" defer></script>
</body>
</html>
