name: 定期同步郵戳並檢查資料
on:
  push:
    branches: [main, master]
  schedule:
    # 台灣時間 08:17、12:17、16:17、20:17；GitHub 排程可能延遲。
    - cron: '17 0,4,8,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安裝網站資料抓取套件
        run: pip install -r requirements.txt
      - name: 驗證解析器
        run: python -m unittest discover -s tests -v
      - name: 同步來源、自動重試與資料檢查
        run: python scripts/update_site.py
      - name: 儲存最新資料及圖片
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ images/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update postal postmark data'
            git push
          fi
      - name: 建立網站發布資料夾（不公開程式與工作流程設定）
        shell: bash
        run: |
          mkdir -p site-dist
          cp index.html catalog.html catalog.js visits.js .nojekyll site-dist/
          cp -R data images site-dist/
          rm -f site-dist/data/health.json
          test -s site-dist/data/stamps.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './site-dist'
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 傳送私人管理報告
        env:
          POSTMARK_REPORT_TOKEN: ${{ secrets.POSTMARK_REPORT_TOKEN }}
        run: python scripts/upload_report.py
      - name: 回報無法恢復的來源錯誤
        run: |
          python -c "import json,sys; h=json.load(open('.private/health.json')); sys.exit(1 if h['status']=='retained' else 0)"
