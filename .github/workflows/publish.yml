name: 定期同步郵戳並檢查資料
on:
  push:
    branches: [main, master]
  schedule:
    # 台灣時間 08:17、12:17、16:17、20:17；GitHub 排程可能延遲。
    - cron: '17 0,4,8,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy_first.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: 安裝網站資料抓取套件
        run: pip install -r requirements.txt
      - name: 驗證解析器
        run: |
          python -m unittest discover -s tests -v
          node --test tests/activity-tools.test.cjs
      - name: 同步來源、自動重試與資料檢查
        id: sync
        run: python scripts/update_site.py
      - name: 儲存最新資料及圖片
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ images/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update postal postmark data'
            git push
          fi
      - name: 建立網站發布資料夾（不公開程式與工作流程設定）
        shell: bash
        run: |
          mkdir -p site-dist
          cp index.html catalog.html catalog.js activity-tools.js activity-controls.js visits.js map.html map.js guide.html guide.js site-sections.css .nojekyll site-dist/
          cp -R data images vendor site-dist/
          rm -f site-dist/data/health.json
          test -s site-dist/data/map_offices.json
          test -s site-dist/data/map_mailboxes.json
          test -s site-dist/data/map_lockers.json
          test -s site-dist/vendor/leaflet.js
          test -s site-dist/data/stamps.json
          test -s site-dist/data/activity_locations.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: './site-dist'
      # Artifact upload can finish before the artifact-list service sees it.
      # Keep one upload and retry deployment only; retries never refetch postal data.
      - name: 等待已上傳的網站檔案就緒
        run: sleep 10
      - name: 發布網站（第一次）
        id: deploy_first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: 等待後重試發布
        if: steps.deploy_first.outcome == 'failure'
        run: sleep 15
      - name: 發布網站（第二次）
        id: deploy_retry
        if: steps.deploy_first.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: 最後一次發布前等待
        if: steps.deploy_retry.outcome == 'failure'
        run: sleep 45
      - name: 發布網站（最後一次）
        id: deployment
        if: steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: 傳送私人管理報告
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        env:
          POSTMARK_REPORT_TOKEN: ${{ secrets.POSTMARK_REPORT_TOKEN }}
        run: python scripts/upload_report.py
      - name: 回報無法恢復的來源錯誤
        run: |
          python -c "import json,sys; h=json.load(open('.private/health.json')); sys.exit(1 if h['status']=='retained' else 0)"
